version: "3.8"

networks:
  campus-fomo-net:
    driver: bridge

volumes:
  app-postgres-data:
  keycloak-postgres-data:
  redis-data:

services:
  # App PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: campus-fomo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_fomo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_dev_password
    ports:
      - "5432:5432"
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
    networks:
      - campus-fomo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_fomo"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Keycloak Dedicated PostgreSQL 16
  keycloak-postgres:
    image: postgres:16-alpine
    container_name: campus-fomo-kc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_secure_dev_password
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - campus-fomo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 (Cache, Token Blacklist, SSE PubSub)
  redis:
    image: redis:7-alpine
    container_name: campus-fomo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - campus-fomo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Mailpit (Local SMTP Server & Web Inbox for OTP/Alerts)
  mailpit:
    image: axllent/mailpit:v1.22.4
    container_name: campus-fomo-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - campus-fomo-net

  # Keycloak 26.x IAM
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: campus-fomo-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_secure_dev_password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_secure_dev_password
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-campus-fomo.json:/opt/keycloak/data/import/realm-campus-fomo.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - campus-fomo-net

  # Apache APISIX 3.11 API Gateway (Standalone Declarative Mode)
  apisix:
    image: apache/apisix:3.11.0-debian
    container_name: campus-fomo-apisix
    restart: unless-stopped
    environment:
      APISIX_STAND_ALONE: "true"
    ports:
      - "9080:9080" # Gateway HTTP
      - "9443:9443" # Gateway HTTPS
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      - keycloak
      - redis
    networks:
      - campus-fomo-net
