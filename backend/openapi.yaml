openapi: 3.1.0
info:
  title: Campus FOMO API
  version: 1.0.0
  description: Discovery and registration platform for CHRIST University campus events.
servers:
  - url: /api/v1
    description: V1 Base API Path
paths:
  /healthz:
    get:
      summary: Health probe
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Service dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /auth/signup:
    post:
      summary: Register a new student/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
  /auth/otp/request:
    post:
      summary: Request OTP via SMS or Email
      responses:
        "200":
          description: OTP dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpResponse"
  /auth/otp/verify:
    post:
      summary: Verify OTP code
      responses:
        "200":
          description: OTP verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
  /auth/login:
    post:
      summary: Login with password or OTP
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
  /auth/refresh:
    post:
      summary: Rotate refresh token cookie and receive new access token
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
  /auth/logout:
    post:
      summary: Log out current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/logout-all:
    post:
      summary: Revoke all sessions for the user
      responses:
        "200":
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/phone/change/request:
    post:
      summary: Request OTP to change registered phone number
      responses:
        "200":
          description: OTP sent to new phone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpResponse"
  /auth/phone/change/verify:
    post:
      summary: Verify OTP and update phone number
      responses:
        "200":
          description: Phone number updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /me:
    get:
      summary: Get current user profile
      responses:
        "200":
          description: Profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
    patch:
      summary: Update current user profile
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
  /me/registrations:
    get:
      summary: Get current user registrations
      responses:
        "200":
          description: User registrations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyRegistrationItem"
  /me/bookmarks:
    get:
      summary: Get user bookmarks
      responses:
        "200":
          description: User bookmarks list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyBookmarkItem"
  /me/bookmarks/{eventId}:
    post:
      summary: Toggle saved bookmark for an event
      responses:
        "200":
          description: Updated bookmark status
          content:
            application/json:
              schema:
                type: object
  /events/leaderboard:
    get:
      summary: Get privacy-safe deanery and student XP leaderboard
      responses:
        "200":
          description: Campus leaderboard standings
          content:
            application/json:
              schema:
                type: object
  /events/pulse:
    get:
      summary: Get anonymized live concourse activity pulse
      responses:
        "200":
          description: Campus pulse stream
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /me/xp:
    get:
      summary: Get user XP, streak, and badges
      responses:
        "200":
          description: User XP summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyXpSummary"
  /events:
    get:
      summary: List and filter published events
      responses:
        "200":
          description: List of events with pagination cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsListResponse"
    post:
      summary: Create event draft
      responses:
        "201":
          description: Event draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /events/{id}:
    get:
      summary: Get event by ID
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    patch:
      summary: Update event draft or details
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /events/{id}/submit:
    post:
      summary: Submit event draft for two-stage approval
      responses:
        "200":
          description: Event submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /events/{id}/cancel:
    post:
      summary: Cancel an event
      responses:
        "200":
          description: Event cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /events/{id}/attendees:
    get:
      summary: List attendees for an event
      responses:
        "200":
          description: Attendees roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAttendeesResponse"
  /events/{id}/qr:
    get:
      summary: Generate rotating QR check-in token
      responses:
        "200":
          description: QR token data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventQrResponse"
  /events/{id}/register:
    post:
      summary: Register for event or join waitlist (requires Idempotency-Key header)
      responses:
        "201":
          description: Registration outcome (CONFIRMED or WAITLISTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
    delete:
      summary: Cancel registration and promote waitlist
      responses:
        "200":
          description: Registration cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelRegistrationResponse"
  /events/{id}/checkin:
    post:
      summary: Check in attendee by QR or manual override
      responses:
        "200":
          description: Check-in result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResponse"
  /approvals:
    get:
      summary: Get events pending faculty or admin approval
      responses:
        "200":
          description: Approvals queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalsListResponse"
  /approvals/{id}/approve:
    post:
      summary: Approve pending event stage
      responses:
        "200":
          description: Event approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /approvals/{id}/reject:
    post:
      summary: Reject pending event with reason
      responses:
        "200":
          description: Event rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /admin/users:
    get:
      summary: List users for administration
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersListResponse"
  /admin/users/{id}:
    patch:
      summary: Update user role or active status
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
  /admin/audit:
    get:
      summary: View immutable system audit logs
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogsResponse"
  /admin/ops:
    get:
      summary: Live operations and provider health metrics
      responses:
        "200":
          description: Ops telemetry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsMetricsResponse"
  /feed:
    get:
      summary: Get server-driven layout feed spec
      responses:
        "200":
          description: Feed layout spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
  /search/suggest:
    get:
      summary: Typo-tolerant search suggestions
      responses:
        "200":
          description: Suggestions and matching clubs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchSuggestResponse"
  /stream:
    get:
      summary: Real-time Server-Sent Events stream
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream: {}
  /stream/poll:
    get:
      summary: HTTP short-polling stream fallback
      responses:
        "200":
          description: Recent stream events
  /venues:
    get:
      summary: List CHRIST Central Campus venues
      responses:
        "200":
          description: Campus venue directory
  /events/clash-check:
    get:
      summary: Automated <150ms venue clash and monsoon backup check
      responses:
        "200":
          description: Clash inspection report
  /events/proposals:
    post:
      summary: Submit two-stage event proposal
      responses:
        "201":
          description: Proposal created in PENDING_FACULTY
  /events/{id}/approve-faculty:
    post:
      summary: Stage-1 Faculty Coordinator departmental endorsement
      responses:
        "200":
          description: Transitioned to PENDING_DEAN
  /events/{id}/approve-dean:
    post:
      summary: Stage-2 Dean of Students budget clearance and publication
      responses:
        "200":
          description: Transitioned to PUBLISHED
  /events/{id}/reject:
    post:
      summary: Reject event proposal with mandatory reason
      responses:
        "200":
          description: Transitioned to REJECTED
  /events/{id}/volunteers:
    get:
      summary: List delegated gate volunteers
      responses:
        "200":
          description: Volunteer assignments
    post:
      summary: Delegate QR scanner volunteer access
      responses:
        "200":
          description: Volunteer assigned
  /events/{id}/broadcast:
    post:
      summary: Send BCC-masked broadcast announcement
      responses:
        "200":
          description: Broadcast dispatched
  /events/{id}/export:
    get:
      summary: Export masked attendee roster
      responses:
        "200":
          description: Attendee export attachment
  /registrations/me:
    get:
      summary: List authenticated attendee passes
      responses:
        "200":
          description: User registrations
  /registrations/{id}/cancel:
    post:
      summary: "Cancel registration and atomically promote waitlist #1"
      responses:
        "200":
          description: Cancelled and promoted
  /checkin/scan:
    post:
      summary: Verify rotating 30s HMAC QR pass (<500ms)
      responses:
        "200":
          description: Checkin admission verdict
  /checkin/stats:
    get:
      summary: Zero-PII gate admission telemetry
      responses:
        "200":
          description: Gate admission counters
  /checkin/token/{id}:
    get:
      summary: Issue rotating 30s HMAC QR token for ticket owner
      responses:
        "200":
          description: Rotating QR token
  /luckydraw/campaigns:
    get:
      summary: List commit-reveal lucky draw campaigns (seedSecret sealed)
      responses:
        "200":
          description: Campaign list
    post:
      summary: Create commit-reveal lucky draw campaign
      responses:
        "201":
          description: Campaign created
  /luckydraw/campaigns/{id}/session:
    post:
      summary: Start anti-replay entry session
      responses:
        "200":
          description: Entry session token
  /luckydraw/campaigns/{id}/enter:
    post:
      summary: Submit single-entry draw ticket
      responses:
        "201":
          description: Draw entry confirmed
  /luckydraw/campaigns/{id}/draw:
    post:
      summary: Execute SHA-256 commit-reveal draw
      responses:
        "200":
          description: Winner selected and seed revealed
  /luckydraw/campaigns/{id}/verify:
    get:
      summary: Verify cryptographic SHA-256 commit-reveal proof
      responses:
        "200":
          description: Mathematical verification proof
  /gallery:
    get:
      summary: List Campus Fest gallery archive
      responses:
        "200":
          description: Gallery items
  /sponsors/showcase:
    get:
      summary: Public campus partner showcase
      responses:
        "200":
          description: Partner showcase data
  /sponsors/analytics:
    get:
      summary: Aggregated PII-free partner engagement analytics
      responses:
        "200":
          description: Aggregated analytics
  /me/permissions:
    get:
      summary: List active PBAC permissions
      responses:
        "200":
          description: User permissions
  /me/navigation:
    get:
      summary: Permission-filtered navigation screens
      responses:
        "200":
          description: Authorized screen catalog
  /me/gamification:
    get:
      summary: Append-only student XP and badges ledger
      responses:
        "200":
          description: XP ledger
  /admin/rbac/roles:
    get:
      summary: Inspect PBAC role bundles and 44 canonical permissions
      responses:
        "200":
          description: Role matrix
    post:
      summary: Create or update runtime PBAC role bundle
      responses:
        "201":
          description: Role saved
  /admin/rbac/users/{sub}/grant:
    post:
      summary: Grant direct PBAC permissions to user
      responses:
        "200":
          description: Permissions granted
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
        - uptime
      properties:
        status:
          type: string
          enum:
            - ok
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        uptime:
          type: number
    ReadyResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
    SignUpRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        name:
          type: string
        phone:
          type: string
        studentRegisterNumber:
          type: string
        department:
          type: string
        institution:
          type: string
        year:
          type: integer
        accountType:
          type: string
          enum:
            - student
            - guest
    AuthTokenResponse:
      type: object
      required:
        - accessToken
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: "#/components/schemas/UserPublic"
    OtpResponse:
      type: object
      required:
        - message
        - expiresInSeconds
        - cooldownSeconds
      properties:
        message:
          type: string
        expiresInSeconds:
          type: integer
        cooldownSeconds:
          type: integer
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    UserPublic:
      type: object
      required:
        - id
        - email
        - name
        - role
      properties:
        id:
          type: string
        sub:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        name:
          type: string
        role:
          type: string
        department:
          type: string
          nullable: true
        institution:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            type: string
    MyRegistrationItem:
      type: object
    MyBookmarkItem:
      type: object
    MyXpSummary:
      type: object
    Event:
      type: object
      required:
        - id
        - title
        - category
        - status
        - venueName
        - startsAt
        - endsAt
        - capacity
        - confirmedCount
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        status:
          type: string
        venueId:
          type: string
        venueName:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        capacity:
          type: integer
        confirmedCount:
          type: integer
        waitlistCap:
          type: integer
        waitlistCount:
          type: integer
        isExternalOpen:
          type: boolean
        fee:
          type: integer
    EventsListResponse:
      type: array
      items:
        $ref: "#/components/schemas/Event"
    EventAttendeesResponse:
      type: array
      items:
        type: object
    EventQrResponse:
      type: object
    RegisterResponse:
      type: object
    CancelRegistrationResponse:
      type: object
    CheckInResponse:
      type: object
    ApprovalsListResponse:
      type: array
      items:
        $ref: "#/components/schemas/Event"
    AdminUsersListResponse:
      type: object
    AuditLogsResponse:
      type: object
    OpsMetricsResponse:
      type: object
    FeedResponse:
      type: object
    SearchSuggestResponse:
      type: object
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
